name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core tests + benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (map conversion)
        run: pip install pillow

      - name: Convert map PNG to PGM
        run: python3 core/tools/png_to_pgm.py maps/indoor_grid.png maps/indoor_grid.pgm

      - name: Build and run Dijkstra-validated planner tests
        run: make -C core test

      - name: Fuzz incremental replanning (8 modes x 3000 seeds vs Dijkstra)
        run: make -C core fuzz

      - name: Build benchmark
        run: make -C core benchmark

      - name: Benchmark smoke run (20 trials, exits nonzero on any cost mismatch)
        run: |
          mkdir -p /tmp/results
          core/build/benchmark --map maps/indoor_grid.pgm \
            --out /tmp/results/replan_benchmark_ci.csv --trials 20 --events 8 --seed 42

      - name: Upload CI benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: replan-benchmark-ci
          path: /tmp/results/replan_benchmark_ci.csv

  core-gtest:
    name: Core unit tests (GoogleTest + CTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (fetches GoogleTest, pinned to v1.15.2)
        run: cmake -S core -B core/build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build core/build-cmake --parallel

      # One CTest case per seed, so a failure names the scenario rather than
      # only the suite. --output-on-failure prints the oracle comparison.
      - name: Run unit tests
        run: ctest --test-dir core/build-cmake --output-on-failure

  ros:
    name: Nav2 plugin build and launch test (ROS 2 Humble)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4

      - name: Install Nav2 build and test dependencies
        run: |
          apt-get update
          apt-get install -y \
            ros-humble-nav2-core \
            ros-humble-nav2-costmap-2d \
            ros-humble-nav2-util \
            ros-humble-nav2-planner \
            ros-humble-nav2-lifecycle-manager \
            ros-humble-nav2-msgs \
            ros-humble-launch-testing-ament-cmake \
            ros-humble-launch-testing-ros \
            ros-humble-tf2-ros \
            ros-humble-rclpy
        shell: bash

      - name: colcon build
        run: |
          . /opt/ros/humble/setup.sh
          mkdir -p /ws/src
          cp -r "$GITHUB_WORKSPACE" /ws/src/ros2_dynamic_path_planning
          cd /ws
          colcon build --packages-select ros2_dynamic_path_planning --event-handlers console_direct+
        shell: bash

      # Brings up a real planner_server with the plugin, drives it to active and
      # calls ComputePathToPose. Covers the boundary the core unit tests cannot.
      - name: colcon test (launch_testing integration)
        run: |
          . /opt/ros/humble/setup.sh
          cd /ws
          colcon test --packages-select ros2_dynamic_path_planning \
            --event-handlers console_direct+ --return-code-on-test-failure
        shell: bash

      - name: Test results
        if: always()
        run: |
          . /opt/ros/humble/setup.sh
          cd /ws
          colcon test-result --all --verbose
        shell: bash
