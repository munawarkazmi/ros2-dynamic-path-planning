# config/nav2_params.yaml
#
# Minimal Nav2 overrides for running the planners in this package.
# Merge over a full nav2_bringup params file; only the planner_server
# section differs from stock Nav2.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Switch to "ros2_dynamic_path_planning/AStarPlanner" to compare.
      plugin: "ros2_dynamic_path_planning/DStarLitePlanner"

bt_navigator:
  ros__parameters:
    use_sim_time: true
